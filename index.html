<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Ome Jan Beurtbier</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
/>
<style>
  :root {
    --red: #d2122e;
    --red-dark: #7a0c1d;
    --red-bright: #ff3b52;
    --ink: #17161b;
    --paper: #f6f3ec;
    --paper-2: #ece7d9;
    --line: #e3dfd3;
    --gold: #e8a93b;
    --muted: #8b8880;
    --white: #ffffff;
    --good: #16a34a;
    --shadow: 0 12px 30px -14px rgba(23, 22, 27, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0e0d11;
    min-height: 100vh;
  }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 28px 14px 56px;
  }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .spin { animation: bb-spin 0.85s linear infinite; }
  @keyframes bb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation-duration: 2.4s; }
  }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red-bright); flex-shrink: 0; animation: bb-pulse 1.4s ease-in-out infinite; }
  @keyframes bb-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }

  #app {
    width: 100%;
    max-width: 460px;
  }
  .shell {
    background: var(--paper);
    color: var(--ink);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  /* ---- onboarding ---- */
  .onboard { padding: 3rem 1.75rem; text-align: center; }
  .onboard-badge {
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 1.6px;
    color: var(--red); font-weight: 700; margin-bottom: 10px;
  }
  .onboard-title {
    font-family: "Oswald", sans-serif; font-size: 34px; font-weight: 700; margin: 0;
    text-transform: uppercase; letter-spacing: 0.5px; text-wrap: balance;
  }
  .onboard-sub { color: var(--muted); font-size: 14px; margin: 8px 0 24px; }
  .onboard-input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line);
    font-size: 15px; margin-bottom: 12px; background: var(--white); color: var(--ink);
  }
  .onboard-note { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.55; }
  .onboard-picklist { display: flex; flex-direction: column; gap: 8px; max-width: 320px; margin: 0 auto; }
  .onboard-pick-btn {
    padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--white);
    font-size: 15px; font-weight: 600; color: var(--ink); text-align: left;
  }
  .onboard-pick-btn:hover { border-color: var(--red); }
  .diag {
    margin-top: 20px; max-width: 320px; margin-left: auto; margin-right: auto; text-align: left;
    font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .diag summary { cursor: pointer; font-weight: 600; font-size: 11.5px; }
  .diag-content { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; }

  .btn-primary {
    width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 12px 16px;
    font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  /* ---- header / tabs ---- */
  .header {
    display: flex; align-items: center; justify-content: space-between; padding: 16px 18px;
    background: var(--ink); color: #fff; gap: 10px;
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-eyebrow { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 1.2px; color: var(--gold); font-weight: 700; }
  .header-title { font-family: "Oswald", sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; }
  .header-me { font-size: 12px; background: rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .test-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #3a2e00;
    color: var(--gold); padding: 8px 16px; font-size: 12.5px; font-weight: 600;
  }
  .test-banner-btn { background: var(--gold); color: #3a2e00; border: none; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  /* flex: 0 0 auto (i.p.v. 1 1 auto) is bewust: zo blijft elke tab-tekst
     volledig leesbaar op een smal scherm — de balk als geheel scrollt dan
     opzij in plaats van dat elke tab-tekst wordt afgekapt met "...". */
  .tabbar { display: flex; border-bottom: 1px solid var(--line); background: #fff; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab-btn {
    flex: 0 0 auto; padding: 11px 8px; background: none; border: none; font-size: 11.5px; color: var(--muted); font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 3px; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
  .main { padding: 18px 16px 28px; min-height: 200px; }

  .section-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .section-head {
    font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase; font-weight: 700; margin: 18px 0 10px;
  }
  .section-head:first-child { margin-top: 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .input {
    flex: 1; min-width: 0; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
    font-size: 14px; background: #fff; color: var(--ink);
  }
  /* Binnen een rij met meerdere velden naast elkaar (datum/tijd/tegenstander)
     moet elk veld een minimumbreedte houden — anders knijpt flexbox ze allemaal
     even smal in plaats van de rij netjes over twee regels te verdelen. */
  .form-row > .input { flex: 1 1 130px; min-width: 130px; }
  .toggle-group { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .toggle-btn { padding: 9px 14px; background: #fff; border: none; font-size: 13px; color: var(--muted); }
  .toggle-btn.active { background: var(--red); color: #fff; }
  .btn-primary-sm { background: var(--red); color: #fff; border: none; border-radius: 7px; padding: 9px 16px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
  .btn-primary-sm:disabled { opacity: 0.5; }
  .btn-ghost-sm {
    display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 11px; font-size: 12.5px; color: var(--ink); font-weight: 500;
  }
  .empty-state { text-align: center; padding: 2rem 1rem; border: 1px dashed var(--line); border-radius: 10px; }
  .empty-title { font-weight: 600; margin: 0 0 4px; }
  .empty-body { font-size: 13px; color: var(--muted); margin: 0; }

  .match-list { display: flex; flex-direction: column; gap: 8px; }
  .match-row {
    display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%;
  }
  .match-row:hover { border-color: var(--red); }
  .match-date-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 44px;
    background: var(--ink); color: #fff; border-radius: 8px; flex-shrink: 0;
  }
  .match-date-num { font-family: "Oswald", sans-serif; font-size: 17px; font-weight: 700; line-height: 1; }
  .match-date-mon { font-family: "JetBrains Mono", monospace; font-size: 9px; text-transform: uppercase; color: var(--gold); }
  .match-opponent { font-weight: 600; font-size: 14.5px; }
  .match-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .match-row-body { flex: 1; text-align: left; min-width: 0; }

  .match-detail-head { margin-bottom: 12px; }
  .head-badge { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--red); font-weight: 700; letter-spacing: 0.5px; }
  .match-detail-title { font-family: "Oswald", sans-serif; font-size: 22px; font-weight: 700; margin: 4px 0 2px; text-transform: uppercase; text-wrap: balance; }
  .match-detail-date { font-size: 13px; color: var(--muted); text-transform: capitalize; }
  .match-switch-row { display: flex; justify-content: flex-end; margin-bottom: 2px; }
  .match-switch-select {
    max-width: 220px; padding: 5px 8px; border-radius: 20px; border: 1px solid var(--line); background: #fff;
    font-size: 11.5px; color: var(--muted); font-weight: 500;
  }

  .stat-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .stat-box { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 10px 8px; text-align: center; }
  .stat-box.warn { border-color: var(--red); background: #fff7f5; }
  .stat-num { font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 10.5px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }

  .roster-list { display: flex; flex-direction: column; gap: 6px; }
  .roster-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; flex-wrap: wrap; }
  .roster-row.me { border-color: var(--red); background: #fff7f5; }
  .roster-row.winner { border-color: var(--good); background: #f0faf3; border-width: 2px; }
  .roster-row.winner .roster-name { font-weight: 700; }
  .checkbox {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); background: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; padding: 0;
  }
  .checkbox.on { background: var(--red); border-color: var(--red); }
  .checkbox:disabled { opacity: 0.45; }
  .checkbox-dark {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.3); background: transparent;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; padding: 0;
  }
  .checkbox-dark.on { background: var(--red); border-color: var(--red); }
  .roster-name { flex: 1; font-size: 14px; font-weight: 500; min-width: 60px; }
  .beer-stepper { display: flex; align-items: center; gap: 8px; }
  .step-btn {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: #fff; font-size: 15px;
    display: flex; align-items: center; justify-content: center; line-height: 1; color: var(--ink); padding: 0;
  }
  .step-btn-light {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08);
    font-size: 17px; display: flex; align-items: center; justify-content: center; line-height: 1; color: #fff; padding: 0;
  }
  .step-btn-light-sm {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08);
    font-size: 14px; display: flex; align-items: center; justify-content: center; line-height: 1; color: #fff; padding: 0;
  }
  .step-btn:disabled, .step-btn-light:disabled, .step-btn-light-sm:disabled { opacity: 0.35; }
  .beer-count { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 14px; min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }

  .scoreboard { background: var(--ink); border-radius: 10px; padding: 16px; margin-bottom: 6px; }
  .scoreboard-hint { color: rgba(255,255,255,0.6); font-size: 12.5px; text-align: center; margin-bottom: 10px; }
  .spin-name { font-family: "JetBrains Mono", monospace; color: var(--gold); font-size: 22px; font-weight: 700; text-align: center; padding: 10px 0; letter-spacing: 0.5px; }
  .progress-note { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .progress-bar-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; margin-bottom: 10px; }
  .progress-bar-fill { height: 100%; background: var(--gold); border-radius: 3px; }
  .pending-names-note { color: rgba(255,255,255,0.55); font-size: 11.5px; text-align: center; margin-bottom: 10px; line-height: 1.5; }
  .wheel-warn { font-size: 11.5px; color: var(--gold); margin-top: 8px; line-height: 1.4; text-align: center; }
  .pending-card { text-align: center; padding: 4px 0 6px; }
  .pending-label { font-family: "Oswald", sans-serif; color: #fff; font-size: 19px; font-weight: 700; text-transform: uppercase; text-wrap: balance; }
  .pending-sub { color: rgba(255,255,255,0.65); font-size: 12.5px; margin-top: 3px; }
  .pending-count { font-family: "JetBrains Mono", monospace; color: var(--gold); font-weight: 700; font-size: 22px; min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
  .pending-count-sm { font-family: "JetBrains Mono", monospace; color: #fff; font-weight: 700; font-size: 14px; min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }
  .hauler-block { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 12px; }
  .hauler-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hauler-name { color: #fff; font-size: 13.5px; font-weight: 600; }
  .empty-cups-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .empty-cups-label { color: rgba(255,255,255,0.6); font-size: 11.5px; text-align: left; flex: 1; }
  .haul-returns-block { margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.15); }
  .haul-returns-title { color: rgba(255,255,255,0.75); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .return-row-dark { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .return-name-dark { flex: 1; color: #fff; font-size: 13px; }
  .btn-ghost-dark {
    flex: 1; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; padding: 11px 0; font-size: 13.5px; font-weight: 500;
  }
  .btn-draw {
    flex: 2; width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 11px 0;
    font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn-draw:disabled { opacity: 0.4; }
  .btn-draw-xl {
    width: 100%; background: var(--red); color: #fff; border: none; border-radius: 12px; padding: 17px 0;
    font-size: 16.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 9px;
    box-shadow: 0 8px 20px -8px rgba(210,18,46,0.55);
  }
  .btn-draw-xl:disabled { opacity: 0.35; box-shadow: none; }
  .reveal-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .reveal-item {
    font-family: "JetBrains Mono", monospace; color: #fff; font-size: 12.5px; background: rgba(255,255,255,0.06);
    border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .icon-btn-dark {
    width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2); background: transparent;
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6); flex-shrink: 0; padding: 0;
  }

  .info-note { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.55; }
  .info-note svg { vertical-align: -2px; margin-right: 4px; }
  .settle-list { display: flex; flex-direction: column; gap: 6px; }
  .settle-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; }
  .settle-name { font-weight: 600; font-size: 14px; }
  .settle-meta { font-size: 11.5px; color: var(--muted); }
  .settle-amount { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 15px; color: var(--red); font-variant-numeric: tabular-nums; margin-left: auto; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: #fff;
    display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0; padding: 0;
  }

  .stand-table { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .scroll-hint { display: flex; align-items: center; gap: 2px; justify-content: flex-end; font-size: 10.5px; color: var(--muted); margin: -4px 2px 6px; }
  .stand-head-row { display: flex; padding: 9px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--line); font-weight: 700; min-width: 320px; }
  .stand-row { display: flex; padding: 10px 12px; font-size: 13.5px; border-bottom: 1px solid var(--line); min-width: 320px; }
  .stand-row:last-child { border-bottom: none; }
  .stand-col { width: 66px; text-align: center; font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
  .stand-name { flex: 1; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .rank-badge { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); width: 16px; }

  .member-chip-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .member-chip { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 5px 6px 5px 12px; font-size: 13px; }
  .test-pick-chip { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
  .chip-remove { width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--line); display: flex; align-items: center; justify-content: center; padding: 0; }
  .field-label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .manage-match-block { border-bottom: 1px solid var(--line); padding: 2px 0 6px; }
  .manage-match-block:last-child { border-bottom: none; }
  .manage-match-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 4px; font-size: 13px; gap: 8px; }
  .manage-match-detail-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 2px 0 6px; }
  .manage-match-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .input-tiny { width: 112px; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; }
  .input-score { width: 44px; padding: 5px 4px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; text-align: center; }
  .predict-score-row { display: flex; align-items: center; gap: 2px; }
  .predict-final-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  /* De twee score-invoervelden (en het streepje ertussen) horen bij elkaar en
     mogen dus nooit los van elkaar naar een nieuwe regel springen — anders
     staat er ineens één losse invoer in z'n eentje op een regel. */
  .score-input-pair { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .predict-win-badge { font-size: 11px; font-weight: 700; color: #fff; background: var(--good); padding: 2px 7px; border-radius: 10px; margin-left: 6px; white-space: nowrap; }
  .predict-loss-badge { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--paper); padding: 2px 7px; border-radius: 10px; margin-left: 6px; white-space: nowrap; }

  .cta-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .cta-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; }
  .cta-card.active { border-color: var(--red); background: #fff7f5; }
  .cta-checkbox { width: 30px; height: 30px; border-radius: 8px; margin-top: 1px; }
  .cta-text-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cta-title { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .cta-sub { font-size: 12px; color: var(--muted); }

<script>
(function () {
  "use strict";

  /* ================= pure helpers ================= */
  var uid = function () { return Math.random().toString(36).slice(2, 10); };
  var euro = function (n) { return "€" + (Math.round((n || 0) * 100) / 100).toFixed(2).replace(".", ","); };
  var euroSigned = function (n) { var r = Math.round((n || 0) * 100) / 100; return (r < -0.001 ? "-" : r > 0.001 ? "+" : "") + euro(Math.abs(r)); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var clamp0 = function (n) { return Math.max(0, n || 0); };
  var clone = function (o) {
    if (typeof structuredClone === "function") return structuredClone(o);
    return JSON.parse(JSON.stringify(o));
  };
  var sleep = function (ms) { return new Promise(function (res) { setTimeout(res, ms); }); };

  function weightedPick(candidates, weights) {
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < candidates.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return candidates.length - 1;
  }

  function roundHalers(round) {
    return (round && round.halers) || [];
  }

  function getNextMatchId(matches) {
    if (!matches || matches.length === 0) return null;
    var now = Date.now();
    // De "14:30" hier is puur een interne sorteerhulp (welke wedstrijd openen we
    // standaard) als de tijd nog niet is ingevuld — dit wordt nooit aan de
    // gebruiker getoond als zijnde de echte aftraptijd, zie renderAanmeldenTab.
    var withTs = matches.map(function (m) {
      return { id: m.id, ts: new Date(m.date + "T" + (m.time || "14:30") + ":00").getTime() };
    });
    var upcoming = withTs.filter(function (m) { return m.ts >= now - 4 * 60 * 60 * 1000; });
    if (upcoming.length > 0) {
      upcoming.sort(function (a, b) { return a.ts - b.ts; });
      return upcoming[0].id;
    }
    withTs.sort(function (a, b) { return b.ts - a.ts; });
    return withTs[0].id;
  }

  // Geschatte eindtijd (aftrap + speeltijd incl. rust/blessuretijd, standaard 2 uur,
  // per wedstrijd aan te passen bij Instellingen) — gebruikt om vlak voor het einde
  // een duidelijk inleverpunt voor de lege bekers aan te wijzen. Zonder een echt
  // ingevulde aftraptijd kunnen we dit niet betrouwbaar schatten (voorheen viel dit
  // stilzwijgend terug op 14:30, ook als de wedstrijd om bv. 20:00 begon) — dan
  // liever geen banner tonen dan een banner op een verzonnen tijdstip.
  function estimatedEndMs(match) {
    if (!match || !match.date || !match.time) return null;
    var kickoffMs = new Date(match.date + "T" + match.time + ":00").getTime();
    return kickoffMs + (match.estimatedDurationMin || 120) * 60 * 1000;
  }

  // Eén nettobedrag per persoon: content (bier), statiegeld voorgeschoten/ontvangen,
  // kwijtgeraakte bekers eerlijk verdeeld, en de gok-vrijstelling voor wie de
  // exacte eindstand goed had. Positief = de groep is dit aan hen verschuldigd.
  function computeNetBalances(checkins, rounds, returns, settings, predictions, finalScore, finalScoreAt) {
    var price = settings.pricePerBeer || 0;
    var deposit = settings.depositPerCup != null ? settings.depositPerCup : 1;
    var attendeeIds = checkins;
    var net = {};
    var matchNet = {};
    var ensure = function (obj, id) { if (obj[id] === undefined) obj[id] = 0; };
    // Volledige, controleerbare optelling per persoon — dezelfde getallen die
    // in `net` verdwijnen, maar hier uitgesplitst zodat iedereen kan natellen
    // waar het nettobedrag vandaan komt (zie "Financiële afrekening").
    var breakdown = {};
    var ensureBk = function (id) {
      if (!breakdown[id]) breakdown[id] = { haaldeBeker: 0, haaldeCredit: 0, dronkBeker: 0, dronkDebit: 0, statiegeldTerugCups: 0, statiegeldTerugDebit: 0, kwijtAandeel: 0, gokAdjust: 0 };
      return breakdown[id];
    };
    var totalBought = 0;
    rounds.forEach(function (round) {
      var isMatchRound = !finalScoreAt || (round.ts || 0) < finalScoreAt;
      var halers = roundHalers(round);
      var brought = halers.reduce(function (s, h) { return s + (h.broughtBack || 0); }, 0);
      totalBought += brought;
      halers.forEach(function (h) {
        ensure(net, h.personId);
        net[h.personId] += (h.broughtBack || 0) * (price + deposit);
        if (isMatchRound) { ensure(matchNet, h.personId); matchNet[h.personId] += (h.broughtBack || 0) * (price + deposit); }
        var bk = ensureBk(h.personId);
        bk.haaldeBeker += h.broughtBack || 0;
        bk.haaldeCredit += (h.broughtBack || 0) * (price + deposit);
      });
      var queue = [];
      (round.wanters || []).forEach(function (w) { for (var i = 0; i < w.qty; i++) queue.push(w.personId); });
      var idx = 0;
      for (var i2 = 0; i2 < brought && idx < queue.length; i2++, idx++) {
        var pid = queue[idx];
        ensure(net, pid); net[pid] -= price;
        if (isMatchRound) { ensure(matchNet, pid); matchNet[pid] -= price; }
        var bkD = ensureBk(pid);
        bkD.dronkBeker += 1;
        bkD.dronkDebit -= price;
      }
    });
    var returnEntries = Object.entries(returns || {});
    var totalReturned = returnEntries.reduce(function (s, e) { return s + (e[1] || 0); }, 0);
    var lostCups = Math.max(0, totalBought - totalReturned);
    var lostShare = attendeeIds.length ? (lostCups * deposit) / attendeeIds.length : 0;
    returnEntries.forEach(function (e) {
      ensure(net, e[0]); net[e[0]] -= (e[1] || 0) * deposit;
      var bk = ensureBk(e[0]);
      bk.statiegeldTerugCups += e[1] || 0;
      bk.statiegeldTerugDebit -= (e[1] || 0) * deposit;
    });
    attendeeIds.forEach(function (pid) {
      ensure(net, pid); net[pid] -= lostShare;
      ensureBk(pid).kwijtAandeel -= lostShare;
    });

    var predEntries = Object.entries(predictions || {});
    var winnerIds = [], loserIds = [];
    if (finalScore && predEntries.length > 0) {
      predEntries.forEach(function (e) {
        var p = e[1];
        if (p && p.home === finalScore.home && p.away === finalScore.away) winnerIds.push(e[0]);
        else loserIds.push(e[0]);
      });
    }
    var forgivenTotal = 0;
    if (winnerIds.length > 0 && loserIds.length > 0) {
      winnerIds.forEach(function (pid) {
        var matchDebt = matchNet[pid] || 0;
        if (matchDebt < 0) { forgivenTotal += -matchDebt; ensure(net, pid); net[pid] -= matchDebt; ensureBk(pid).gokAdjust -= matchDebt; }
      });
      var perLoser = forgivenTotal / loserIds.length;
      loserIds.forEach(function (pid) { ensure(net, pid); net[pid] -= perLoser; ensureBk(pid).gokAdjust -= perLoser; });
    }
    return { net: net, breakdown: breakdown, totalBought: totalBought, totalReturned: totalReturned, lostCups: lostCups, lostShare: lostShare, winnerIds: winnerIds, loserIds: loserIds, forgivenTotal: forgivenTotal };
  }

  function computeDrunkSoFar(rounds) {
    var drunk = {};
    rounds.forEach(function (round) {
      var brought = roundHalers(round).reduce(function (s, h) { return s + (h.broughtBack || 0); }, 0);
      var queue = [];
      (round.wanters || []).forEach(function (w) { for (var i = 0; i < w.qty; i++) queue.push(w.personId); });
      for (var i = 0; i < brought && i < queue.length; i++) drunk[queue[i]] = (drunk[queue[i]] || 0) + 1;
    });
    return drunk;
  }

  function settleNet(net) {
    var creditors = [], debtors = [];
    Object.entries(net).forEach(function (e) {
      var r = Math.round(e[1] * 100) / 100;
      if (r > 0.005) creditors.push({ id: e[0], amt: r });
      else if (r < -0.005) debtors.push({ id: e[0], amt: -r });
    });
    creditors.sort(function (a, b) { return b.amt - a.amt; });
    debtors.sort(function (a, b) { return b.amt - a.amt; });
    var transactions = [], i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      var pay = Math.min(debtors[i].amt, creditors[j].amt);
      if (pay > 0.005) transactions.push({ from: debtors[i].id, to: creditors[j].id, amount: pay });
      debtors[i].amt -= pay; creditors[j].amt -= pay;
      if (debtors[i].amt <= 0.005) i++;
      if (creditors[j].amt <= 0.005) j++;
    }
    return transactions;
  }

  // Verdeelt wie-levert-bekers-in-bij-wie eerlijk over de gelijktijdige halers,
  // zodat twee halers nooit dezelfde naam allebei kunnen afvinken: elke naam
  // hoort structureel bij precies één van hen. Puur en deterministisch (zelfde
  // input -> zelfde verdeling), dus beide halers zien exact dezelfde toewijzing.
  function partitionReturnCandidates(checkins, halerIds) {
    var candidates = checkins.filter(function (pid) { return halerIds.indexOf(pid) === -1; });
    var groups = halerIds.map(function () { return []; });
    candidates.forEach(function (pid, i) { groups[i % halerIds.length].push(pid); });
    return groups;
  }

  /* ================= personal (per device) storage ================= */
  function getLocal(key, fallback) {

      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function setLocal(key, value) {
    try { window.localStorage.setItem("beurtbier:" + key, JSON.stringify(value)); } catch (e) {}
  }
  // Met Supabase komen updates via een live-verbinding binnen (zie
  // initSupabase hieronder) in plaats van via een volledige pagina-herlaad,

  /* ================= shared state + Supabase plumbing ================= */
  // Vul deze twee waarden in met je eigen Supabase-project (Project settings ->
  // API). De "publishable"/anon key is met opzet openbaar — die staat straks
  // gewoon zichtbaar in de broncode van de pagina. De echte afscherming zit in
  // de Row Level Security-policies die het meegeleverde SQL-script instelt.
  var SUPABASE_URL = "https://pyvpihcfysqkwsqamdlt.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_bCubIC_VlhsKXOXBq7msDQ_sNn-fQE2";

  var defaultSettings = { pricePerBeer: 5.99, cupsPerRun: 8, depositPerCup: 2.0 };
  function defaultState() {
    return { members: [], matches: [], settings: Object.assign({}, defaultSettings), adminPasscode: null, matchData: {} };
  }
  function normalizeState(raw) {
    var s = raw && typeof raw === "object" ? raw : {};
    s.members = s.members || [];
    s.matches = s.matches || [];
    s.settings = Object.assign({}, defaultSettings, s.settings || {});
    s.matchData = s.matchData || {};
    // Migratie: een oudere versie van de app gebruikte een vooraf-ingevulde
    // "wanters"-lijst i.p.v. zelf-gemelde responses. Zet dit best-effort om,
    // zodat een ronde die nog "in de lucht hing" tijdens de update niet crasht.
    Object.keys(s.matchData).forEach(function (mid) {
      var ar = s.matchData[mid] && s.matchData[mid].activeRound;
      if (ar && !ar.responses && Array.isArray(ar.wanters)) {
        var responses = {};
        ar.wanters.forEach(function (w) { if (w.qty > 0) responses[w.personId] = { qty: w.qty }; });
        ar.responses = responses;
      }
    });
    return s;

  var state = defaultState();
  var sb = null;
  var supabaseReady = false;
  var loadError = "";
  var saveError = false;

  async function initSupabase() {
    try {
      if (!window.supabase || typeof window.supabase.createClient !== "function") {
        loadError = "Kon de Supabase-bibliotheek niet laden — controleer je internetverbinding en laad de pagina opnieuw.";
        render();
        return;
      }
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      // De hele app-staat leeft als één rij in de generieke kv_store-tabel,
      // onder de vaste sleutel "app_state".
      var res = await sb.from("kv_store").select("value").eq("key", "app_state").maybeSingle();
      if (res.error) throw res.error;
      if (res.data && res.data.value && Object.keys(res.data.value).length > 0) {
        state = normalizeState(res.data.value);
      } else {
        // Eerste keer: nog geen (gevulde) rij aanwezig -> begin met een lege staat.
        state = defaultState();
        var ins = await sb.from("kv_store").upsert({ key: "app_state", value: state, updated_at: new Date().toISOString() });
        if (ins.error) throw ins.error;
      }
      supabaseReady = true;
      render();
      // Live-sync: zodra iemand anders (of dit apparaat, via een andere tab)
      // iets opslaat, komt de nieuwe staat hier binnen zonder dat er ooit een
      // volledige pagina-herlaad nodig is — dus ook geen navigatie die
      // "springt". We filteren op deze ene rij (key = app_state), zodat we
      // geen updates van andere rijen in kv_store hoeven te negeren.
      sb.channel("kv_store_changes")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "kv_store", filter: "key=eq.app_state" }, function (payload) {
          if (!payload || !payload.new) return;
          state = normalizeState(payload.new.value);
          savePending = false;
          scheduleRender();
        })
        .subscribe();
    } catch (e) {
      console.error("Supabase init mislukt", e);
      loadError = "Kon geen verbinding maken met de database. Controleer of het SQL-installatiescript is uitgevoerd in je Supabase-project, en of de Project URL en key hierboven kloppen." + ((e && e.message) ? " (" + e.message + ")" : "");
      render();
    }
  }

  var debounceTimer = null;
  var debounceDraft = null;

  function emptyMatchData() {
    return { checkins: [], activeRound: null, rounds: [], returns: {}, predictions: {} };
  }
  function matchData(id) {
    if (!state.matchData[id]) state.matchData[id] = emptyMatchData();
    return state.matchData[id];
  }

  async function publishState(next, attempt) {
    attempt = attempt || 1;
    if (!sb) { render(); return; }
    savePending = true;
    render();
    try {
      var res = await sb.from("kv_store").update({ value: next, updated_at: new Date().toISOString() }).eq("key", "app_state");
      if (res.error) throw res.error;
      saveError = false;
      savePending = false;
      render();
      // De realtime-subscriptie hierboven bevestigt dit ook bij onszelf (een
      // onschuldige dubbele render) en stuurt de update naar alle andere
      // geopende apparaten door.

  // deelverzameling namen te zien, dus dit kan nooit dubbel voor dezelfde
  // persoon worden ingevuld door twee gelijktijdige halers.
  app.setReturn = function (matchId, personId, cups) {
    cups = clamp0(cups);
    localMutate(function (draft) {
      var md = draft.matchData[matchId];
      var returns = Object.assign({}, md.returns);
      if (cups > 0) returns[personId] = cups; else delete returns[personId];
      md.returns = returns;
      return draft;
    });
    callRpc("bb_set_return", { p_match_id: matchId, p_person_id: personId, p_cups: cups });
  };
  app.bumpReturn = function (matchId, personId, cups) {
    cups = clamp0(cups);
    localMutate(function (draft) {
      var md = draft.matchData[matchId];
      var returns = Object.assign({}, md.returns);
      if (cups > 0) returns[personId] = cups; else delete returns[personId];
      md.returns = returns;
      return draft;
    });
    var key = "ret|" + matchId + "|" + personId;
    clearTimeout(haulDebounceTimers[key]);
    haulDebounceTimers[key] = setTimeout(function () {
      callRpc("bb_set_return", { p_match_id: matchId, p_person_id: personId, p_cups: cups });
    }, 400);
  };
  app.togglePrediction = function (matchId, personId, on) {
    localMutate(function (draft) {
      var md = draft.matchData[matchId];
      var predictions = Object.assign({}, md.predictions);
      if (on) predictions[personId] = { home: 0, away: 0 }; else delete predictions[personId];
      md.predictions = predictions;
      return draft;
    });
    callRpc("bb_set_prediction", { p_match_id: matchId, p_person_id: personId, p_home: 0, p_away: 0, p_delete: !on });
  };
  app.setPredictionScore = function (matchId, personId, home, away) {
    var md = matchData(matchId);
    var cur = (md.predictions || {})[personId] || { home: 0, away: 0 };
    var next = { home: home == null ? cur.home : clamp0(home), away: away == null ? cur.away : clamp0(away) };
    localMutate(function (draft) {
      var dmd = draft.matchData[matchId];
      var predictions = Object.assign({}, dmd.predictions);
      predictions[personId] = next;
      dmd.predictions = predictions;
      return draft;
    });
    callRpc("bb_set_prediction", { p_match_id: matchId, p_person_id: personId, p_home: next.home, p_away: next.away, p_delete: false });
  };
  app.shareLink = function (text) { window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank"); };

  function renderMatchHeader(match) {

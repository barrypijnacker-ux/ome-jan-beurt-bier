  /* ---- Tabblad: Aanmelden en gokken ---- */
  function renderAanmeldenTab(match) {
    var md = matchData(match.id);
    var checkins = md.checkins || [];
    var predictions = md.predictions || {};
    var me = meId();
    var isChecked = function (pid) { return checkins.indexOf(pid) !== -1; };
    // Zonder een echt ingevulde aftraptijd kunnen we het gokken niet betrouwbaar
    // op tijd op slot zetten (voorheen viel dit stilzwijgend terug op 14:30, ook
    // als de wedstrijd op een heel ander tijdstip begon) — dan liever helemaal
    // niet automatisch vergrendelen, en de beheerder duidelijk vragen de tijd in
    // te vullen.
    var kickoffMs = match.date && match.time ? new Date(match.date + "T" + match.time + ":00").getTime() : null;
    var now = Date.now();
    var predictionsLocked = kickoffMs ? now >= kickoffMs - 60 * 1000 : false;
    var predictionsRevealed = kickoffMs ? now >= kickoffMs + 60 * 1000 : false;

    var html = renderMatchHeader(match);
    if (!match.time) {
      html += '<div class="info-note" style="margin-bottom:10px;background:#3a2e00;color:var(--gold)">' + icon("info", 12) + " Aftraptijd nog niet ingevuld" + (isAdmin() ? " — vul 'm in bij Instellingen, anders sluit het gokken niet vanzelf op tijd." : " — de beheerder moet deze nog invullen, anders sluit het gokken niet vanzelf op tijd.") + "</div>";
    }
    html += '<div class="section-head" style="margin-top:0">Aanmelden en gokken</div>';
    html += '<div class="cta-stack">';
    html += ctaCard({
      icon: "beer", title: isChecked(me) ? "Je wilt bierdrinken" : "Ik wil bierdrinken", sub: checkins.length + " aangemeld",
      active: isChecked(me), onclick: "app.toggleCheckin('" + match.id + "','" + me + "'," + (!isChecked(me)) + ")"
    });
    var predSub = !isChecked(me) ? "meld je eerst aan om te kunnen gokken" : predictionsLocked ? "gokken is gesloten" : match.time ? "tot 1 min. vóór aftrap (" + esc(match.time) + " uur)" : "gokken sluit vanzelf zodra de aftraptijd is ingevuld";
    var predExtra = "";
    var myPred = predictions[me];
    if (myPred) {
      predExtra = '<div class="predict-score-row" style="margin-top:6px">' +
        '<input type="number" min="0" class="input-score" ' + (predictionsLocked ? "disabled" : "") + ' value="' + myPred.home + '" onchange="app.setPredictionScore(\'' + match.id + "','" + me + "', parseInt(this.value,10)||0, null)\" />" +
        '<span style="margin:0 4px;color:var(--muted)">–</span>' +
        '<input type="number" min="0" class="input-score" ' + (predictionsLocked ? "disabled" : "") + ' value="' + myPred.away + '" onchange="app.setPredictionScore(\'' + match.id + "','" + me + "', null, parseInt(this.value,10)||0)\" />" +
        "</div>";
    }
    var predDisabled = !isChecked(me) || (predictionsLocked && !myPred);
    html += ctaCard({
      icon: "target", title: myPred ? "Jouw gok: " + myPred.home + "-" + myPred.away : "Ik wil gokken", sub: predSub,
      active: !!myPred, disabled: predDisabled, extra: predExtra,
      onclick: predDisabled ? "" : "app.togglePrediction('" + match.id + "','" + me + "'," + (!myPred) + ")"
    });
    html += "</div>";

    html += '<div class="section-head">Stand</div><div class="card">';
    if (match.finalScore) {
      html += '<div style="font-size:14px;font-weight:700">Eindstand: AZ ' + match.finalScore.home + " – " + match.finalScore.away + " " + esc(match.opponent) + "</div>";
    } else if (match.liveScore) {
      html += '<div style="display:flex;align-items:center;gap:8px">';
      html += '<span class="live-dot" aria-hidden="true"></span>';
      html += '<div style="font-size:14px;font-weight:700">Live stand: AZ ' + match.liveScore.home + " – " + match.liveScore.away + " " + esc(match.opponent) + "</div></div>";
      html += '<div class="info-note" style="margin-top:6px;margin-bottom:0">Bijgewerkt om ' + new Date(match.liveScore.updatedAt).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }) + ' uur — dit vulde de beheerder handmatig in.</div>';
    } else {
      html += '<div class="info-note" style="margin-bottom:0">Nog geen stand — die vult de beheerder handmatig in. Checken, bier halen en afrekenen loopt gewoon door.</div>';
    }
    if (isAdmin()) {
      html += '<div class="predict-final-row" style="margin-top:' + (match.finalScore || match.liveScore ? "10px" : "8px") + '">';
      html += '<span style="font-size:12.5px;color:var(--muted);font-weight:500">Live tussenstand (handmatig):</span>';
      html += '<span class="score-input-pair">';
      html += '<input type="number" min="0" class="input-score" placeholder="–" value="' + (match.liveScore ? match.liveScore.home : "") + '" onchange="app.setMatchLiveScore(\'' + match.id + "', this.value===''?null:(parseInt(this.value,10)||0), " + (match.liveScore ? match.liveScore.away : 0) + ')" />';
      html += "<span>–</span>";
      html += '<input type="number" min="0" class="input-score" placeholder="–" value="' + (match.liveScore ? match.liveScore.away : "") + '" onchange="app.setMatchLiveScore(\'' + match.id + "', " + (match.liveScore ? match.liveScore.home : 0) + ", this.value===''?null:(parseInt(this.value,10)||0))\" />";
      html += "</span></div>";
    }
    html += "</div>";

    html += '<div class="section-head">Voorspellingen</div><div class="card">';
    if (!predictionsRevealed) {
      var revealNote = kickoffMs
        ? "Voorspellingen van de rest worden zichtbaar vanaf " + new Date(kickoffMs + 60000).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }) + " uur (1 minuut na aftrap) — zo kan niemand nog met andermans gok meekijken."
        : "Voorspellingen van de rest worden pas zichtbaar vanaf 1 minuut na aftrap.";
      html += '<div class="info-note" style="margin-bottom:0">' + revealNote + "</div>";
    } else {
      html += '<div class="info-note">Wie de exacte eindstand goed had, dronk tijdens de wedstrijd gratis — de rest deelde dat bedrag gelijk. Bier na afloop telt gewoon normaal mee.</div>';
      html += '<div class="roster-list">';
      approvedMembers().forEach(function (m) {
        var p = predictions[m.id];
        var hasPrediction = !!p;
        var result = match.finalScore && hasPrediction ? (p.home === match.finalScore.home && p.away === match.finalScore.away ? "win" : "loss") : null;
        html += '<div class="roster-row' + (m.id === me ? " me" : "") + (result === "win" ? " winner" : "") + '">';
        html += '<span class="roster-name">' + esc(m.name) + "</span>";
        if (hasPrediction) {
          html += '<span style="font-family:\'JetBrains Mono\',monospace;font-weight:700">' + p.home + "–" + p.away + "</span>";
          if (result === "win") html += '<span class="predict-win-badge">🎯 goed geraden!</span>';
          if (result === "loss") html += '<span class="predict-loss-badge">mis</span>';
        } else {
          html += '<span class="empty-body">niet gegokt</span>';
        }
        html += "</div>";
      });
      if (state.members.length === 0) html += '<div class="empty-body">Voeg leden toe bij Instellingen.</div>';
      html += "</div>";
    }
    if (isAdmin()) {
      html += '<div class="predict-final-row"><span style="font-size:12.5px;color:var(--muted);font-weight:500">Eindstand invullen:</span>';
      html += '<span class="score-input-pair">';
      html += '<input type="number" min="0" class="input-score" placeholder="–" value="' + (match.finalScore ? match.finalScore.home : "") + '" onchange="app.setMatchFinalScore(\'' + match.id + "', this.value===''?null:(parseInt(this.value,10)||0), " + (match.finalScore ? match.finalScore.away : 0) + ')" />';
      html += "<span>–</span>";
      html += '<input type="number" min="0" class="input-score" placeholder="–" value="' + (match.finalScore ? match.finalScore.away : "") + '" onchange="app.setMatchFinalScore(\'' + match.id + "', " + (match.finalScore ? match.finalScore.home : 0) + ", this.value===''?null:(parseInt(this.value,10)||0))\" />";
      html += "</span></div>";
    }
    html += "</div>";
    return html;
  }

  /* ---- Tabblad: Bier en beurten ---- */
  function renderBeurtenTab(match) {
    var md = matchData(match.id);
    var checkins = md.checkins || [];
    var rounds = md.rounds || [];
    var active = md.activeRound;
    var me = meId();
    var cap = state.settings.cupsPerRun || 8;

    var html = renderMatchHeader(match);
    html += '<div class="section-head" style="margin-top:0">Bier en beurten</div>';

    if (checkins.length === 0) {
      html += '<div class="empty-state"><p class="empty-body">Meld je eerst aan bij "Aanmelden" om een beurt te kunnen starten.</p></div>';
      return html;
    }

    // Vlak voor het (verwachte) einde van de wedstrijd: wijs één duidelijk
    // inleverpunt aan voor de lege bekers, in plaats van erop te vertrouwen dat
    // iedereen dat na afloop nog zelf regelt. Degene die op dat moment het
    // meeste tegoed heeft, is het inleverpunt — logisch, want die heeft er het
    // meeste belang bij dat de bekers ook echt terugkomen.
    var endMs = estimatedEndMs(match);
    if (endMs && Date.now() >= endMs - 5 * 60 * 1000 && rounds.length > 0) {
      var closingSettlement = computeNetBalances(checkins, rounds, md.returns || {}, state.settings, md.predictions || {}, match.finalScore, match.finalScoreAt);
      var collectorId = null, bestAmt = -Infinity;
      checkins.forEach(function (pid) { var v = closingSettlement.net[pid] || 0; if (v > bestAmt) { bestAmt = v; collectorId = pid; } });
      if (collectorId && bestAmt > 0.005) {
        html += '<div class="card" style="border-color:var(--gold);background:#fffaf0">';
        html += '<div style="font-weight:700;font-size:13.5px">⏰ Wedstrijd loopt bijna af</div>';
        html += '<div class="info-note" style="margin-top:4px;margin-bottom:0">Lever je lege beker in bij <b>' + esc(memberName(collectorId)) + "</b> — die heeft op dit moment het meeste tegoed, dus dat scheelt straks verrekenen.</div>";
        html += "</div>";
        if (me === collectorId) {
          var drunkSoFarNow = computeDrunkSoFar(rounds);
          var mdReturnsNow = md.returns || {};
          html += '<div class="section-head">Lege bekers inleveren</div><div class="card">';
          html += '<div class="info-note">Jij bent het inleverpunt — vink hier iedereen af zodra je hun lege beker hebt.</div>';
          html += '<div class="roster-list">';
          checkins.forEach(function (pid) {
            var cups = mdReturnsNow[pid] || 0;
            var checked = cups > 0;
            var suggested = drunkSoFarNow[pid] || 1;
            html += '<div class="roster-row"><button class="checkbox' + (checked ? " on" : "") + '" onclick="app.setReturn(\'' + match.id + "','" + pid + "', " + (checked ? 0 : suggested) + ')" aria-label="Bekers ingeleverd">' + (checked ? icon("check", 13, ' stroke-width="3"') : "") + "</button>";
            html += '<span class="roster-name">' + esc(memberName(pid)) + "</span>";
            if (checked) {
              html += '<div class="beer-stepper"><button class="step-btn" onclick="app.bumpReturn(\'' + match.id + "','" + pid + "', " + Math.max(0, cups - 1) + ')">–</button><span class="beer-count">' + cups + '</span><button class="step-btn" onclick="app.bumpReturn(\'' + match.id + "','" + pid + "', " + (cups + 1) + ')">+</button></div>';
            }
            html += "</div>";
          });
          html += "</div></div>";
        }
      }
    }

    var responses = (active && active.responses) || {};
    var respondedIds = Object.keys(responses);
    var pendingIds = checkins.filter(function (pid) { return respondedIds.indexOf(pid) === -1; });
    var allResponded = pendingIds.length === 0;
    var wantedTotal = respondedIds.reduce(function (s, pid) { return s + (responses[pid].qty || 0); }, 0);
    var myResponse = responses[me];
    var iAmChecked = checkins.indexOf(me) !== -1;

    if (!active || active.stage === "composing") {
      if (iAmChecked) {
        html += '<div class="cta-pair" style="margin-bottom:12px">';
        html += choiceTile({
          icon: "beer", title: myResponse && myResponse.qty > 0 ? "Ik wil bier (" + myResponse.qty + ")" : "Ik wil bier",
          active: !!(myResponse && myResponse.qty > 0), onclick: "app.respondWant('" + match.id + "','" + me + "')"
        });
        html += choiceTile({
          icon: "skip", title: "Ik sla over",
          active: !!(myResponse && myResponse.qty === 0), onclick: "app.respondSkip('" + match.id + "','" + me + "')"
        });
        html += "</div>";
        if (myResponse && myResponse.qty > 0) {
          html += '<div class="card" style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:-4px">';
          html += '<span style="font-size:13px;color:var(--muted)">aantal:</span>';
          html += '<button class="step-btn" onclick="app.setResponseQty(\'' + match.id + "','" + me + "', " + (myResponse.qty - 1) + ')">–</button>';
          html += '<span class="beer-count" style="font-size:18px">' + myResponse.qty + "</span>";
          html += '<button class="step-btn" onclick="app.setResponseQty(\'' + match.id + "','" + me + "', " + (myResponse.qty + 1) + ')">+</button>';
          html += "</div>";
        }
      } else {
        html += '<div class="info-note">Je bent nog niet aangemeld voor deze wedstrijd (zie tabblad Aanmelden), dus je kunt nog niet reageren op deze beurt.</div>';
      }

      html += '<div class="scoreboard">';
      if (ui.drawing) {
        html += '<div class="spin-name">' + esc(ui.spinName) + "</div>";
      } else {
        html += '<div class="progress-note">' + respondedIds.length + " van " + checkins.length + " hebben gereageerd</div>";
        html += '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:' + Math.round((checkins.length ? respondedIds.length / checkins.length : 0) * 100) + '%"></div></div>';
        if (!allResponded && isAdmin()) {
          html += '<div class="pending-names-note">Nog geen reactie van: ' + esc(pendingIds.map(memberName).join(", ")) + "</div>";
        } else if (!allResponded) {
          html += '<div class="pending-names-note">Wacht nog op een paar mensen…</div>';
        }
        if (wantedTotal > cap) {
          html += '<div class="wheel-warn">' + wantedTotal + " bier gevraagd — meer dan " + cap + " per persoon te tillen, dus er worden zo " + Math.ceil(wantedTotal / cap) + " mensen aangewezen die het samen halen.</div>";
        }
        if (allResponded && wantedTotal === 0) {
          html += '<div class="pending-names-note" style="margin-top:6px">Niemand wil deze beurt bier.</div>';
          html += '<button class="btn-ghost-dark" style="width:100%;margin-top:6px" onclick="app.cancelRound(\'' + match.id + '\')">Ronde sluiten</button>';
        } else {
          html += '<button class="btn-draw-xl" ' + (!allResponded || wantedTotal === 0 ? "disabled" : "") + ' onclick="app.startDraw(\'' + match.id + '\')" style="margin-top:4px">' + icon("dice", 18) + " Trek wie haalt</button>";
        }
      }
      html += renderRoundHistory(match, rounds);
      html += "</div>";
    } else if (active.stage === "drawn") {
      var halerIds = active.halers.map(function (h) { return h.personId; });
      var returnGroups = partitionReturnCandidates(checkins, halerIds);
      var haulerNames = active.halers.map(function (h) { return memberName(h.personId); });
      var myHalerEntry = active.halers.find(function (h) { return h.personId === me; });

      html += '<div class="scoreboard">';
      html += '<div class="pending-card"><div class="pending-label">' + (active.halers.length > 1 ? esc(haulerNames.join(" & ")) + " zijn aan de beurt" : esc(haulerNames[0]) + " is aan de beurt") + "</div>";
      var wanterText = Object.keys(active.responses || {}).filter(function (pid) { return active.responses[pid].qty > 0; }).map(function (pid) { return esc(memberName(pid)) + " (" + active.responses[pid].qty + ")"; }).join(", ") || "—";
      html += '<div class="pending-sub">haalt voor: ' + wanterText + "</div>";
      if (active.halers.length > 1) {
        var totH = active.halers.reduce(function (s, h) { return s + (h.broughtBack || 0); }, 0);
        html += '<div class="pending-sub" style="margin-top:4px">samen ' + totH + " bier verdeeld over " + active.halers.length + " man — pas hieronder aan als het anders liep.</div>";
      }
      var roundNumber = rounds.length + 1;
      html += '<div style="display:flex;flex-direction:column;gap:14px;margin:12px 0">';
      active.halers.forEach(function (h, hi) {
        var isMe = h.personId === me;
        html += '<div class="hauler-block"><div class="hauler-top"><span class="hauler-name">' + esc(memberName(h.personId)) + '</span><div class="beer-stepper">';
        html += '<button class="step-btn-light" ' + (isMe ? "disabled" : "") + ' onclick="app.updateHalerBroughtBack(\'' + match.id + "','" + h.personId + "', " + ((h.broughtBack || 0) - 1) + ')">–</button>';
        html += '<span class="pending-count">' + h.broughtBack + "</span>";
        html += '<button class="step-btn-light" ' + (isMe ? "disabled" : "") + ' onclick="app.updateHalerBroughtBack(\'' + match.id + "','" + h.personId + "', " + ((h.broughtBack || 0) + 1) + ')">+</button></div></div>';
        if (isMe) html += '<div class="empty-cups-label" style="margin-top:4px;text-align:left">Dit bevestig je niet zelf — vraag iemand anders die er is.</div>';
        if (roundNumber === 1) {
          html += '<div class="empty-cups-label" style="margin-top:6px">Dit is de eerste beurt — er zijn nog geen lege bekers om in te leveren. Dat komt vanaf de volgende beurt.</div>';
        } else {
          html += '<div class="empty-cups-row"><span class="empty-cups-label">lege bekers die bij ' + (isMe ? "jou" : esc(memberName(h.personId))) + ' zijn ingeleverd</span><div class="beer-stepper">';
          html += '<button class="step-btn-light-sm" ' + (!isMe ? "disabled" : "") + ' onclick="app.updateHalerEmptyCups(\'' + match.id + "','" + h.personId + "', " + ((h.emptyCupsIn || 0) - 1) + ')">–</button>';
          html += '<span class="pending-count-sm">' + (h.emptyCupsIn || 0) + "</span>";
          html += '<button class="step-btn-light-sm" ' + (!isMe ? "disabled" : "") + ' onclick="app.updateHalerEmptyCups(\'' + match.id + "','" + h.personId + "', " + ((h.emptyCupsIn || 0) + 1) + ')">+</button></div></div>';
        }
        // Bekers-inleveren: alleen zichtbaar voor déze haler, en alleen voor zijn/haar
        // eigen vaste deel van de groep — zo kunnen twee gelijktijdige halers nooit
        // dezelfde naam allebei afvinken. Vanaf de eerste beurt heeft nog niemand
        // een lege beker, dus die stap slaan we dan over.
        if (isMe && roundNumber > 1) {
          // De haler levert vanzelfsprekend ook zijn/haar eigen lege beker in
          // (die had diegene toch al bij zich) - dus die hoort altijd bovenaan
          // dit rijtje, naast de partitie van andermans bekers die deze haler
          // toebedeeld kreeg.
          var myGroup = [h.personId].concat(returnGroups[hi] || []);
          html += '<div class="haul-returns-block"><div class="haul-returns-title">Bekers die jij inneemt</div>';
          if (myGroup.length === 0) {
            html += '<div class="empty-cups-label">Niemand anders om bekers van in te nemen.</div>';
          } else {
            var mdReturns = md.returns || {};
            var drunkSoFar = computeDrunkSoFar(rounds);
            myGroup.forEach(function (pid) {
              var cups = mdReturns[pid] || 0;
              var checked = cups > 0;
              var suggested = drunkSoFar[pid] || 1;
              html += '<div class="return-row-dark"><button class="checkbox-dark' + (checked ? " on" : "") + '" style="border-color:rgba(255,255,255,0.3)" onclick="app.setReturn(\'' + match.id + "','" + pid + "', " + (checked ? 0 : suggested) + ')" aria-label="Bekers ingeleverd">' + (checked ? icon("check", 12, ' stroke-width="3"') : "") + "</button>";
              html += '<span class="return-name-dark">' + esc(memberName(pid)) + "</span>";
              if (checked) {
                html += '<div class="beer-stepper"><button class="step-btn-light-sm" onclick="app.bumpReturn(\'' + match.id + "','" + pid + "', " + Math.max(0, cups - 1) + ')">–</button>';
                html += '<span class="pending-count-sm">' + cups + "</span>";
                html += '<button class="step-btn-light-sm" onclick="app.bumpReturn(\'' + match.id + "','" + pid + "', " + (cups + 1) + ')">+</button></div>';
              }
              html += "</div>";
            });
          }
          html += "</div>";
        }
        html += "</div>";
      });
      html += "</div>";
      if (myHalerEntry) {
        html += '<div class="info-note" style="color:#fff;background:rgba(255,255,255,0.08);padding:8px;border-radius:6px;margin-bottom:0">Jij haalt zelf mee — iemand anders in de groep moet dit bevestigen zodra jullie terug zijn.</div>';
      } else {
        var totConfirm = active.halers.reduce(function (s, h) { return s + (h.broughtBack || 0); }, 0);
        var totCups = active.halers.reduce(function (s, h) { return s + (h.emptyCupsIn || 0); }, 0);
        html += '<div style="display:flex;gap:8px"><button class="btn-ghost-dark" onclick="app.cancelRound(\'' + match.id + '\')">Annuleren</button>';
        html += '<button class="btn-draw" onclick="app.confirmRound(\'' + match.id + '\')">' + icon("check", 15) + " Bevestig: " + totConfirm + " bier terug" + (totCups > 0 ? " (+" + totCups + " bekers ingeleverd)" : "") + "</button></div>";
      }
      html += "</div>";
      html += renderRoundHistory(match, rounds);
    }
    return html;
  }

  function renderRoundHistory(match, rounds) {
    if (rounds.length === 0) return "";
    var html = '<div class="reveal-list">';
    rounds.slice().reverse().forEach(function (r) {
      var idx = rounds.indexOf(r);
      var halers = roundHalers(r);
      var totalR = halers.reduce(function (s, h) { return s + (h.broughtBack || 0); }, 0);
      var halerText = halers.map(function (h) { return esc(memberName(h.personId)) + " (" + h.broughtBack + ")"; }).join(" &amp; ");
      html += '<div class="reveal-item"><span>Beurt ' + (idx + 1) + ": <b>" + (halerText || "—") + "</b> haalt " + totalR + " bier voor " + r.wanters.length + " man</span>";
      html += '<button class="icon-btn-dark" onclick="app.removeRound(\'' + match.id + "','" + r.id + '\')" aria-label="Verwijder beurt">' + icon("trash", 12) + "</button></div>";
    });
    html += "</div>";
    return html;
  }

  // Volledige, natelbare berekening per persoon — zodat iedereen zelf kan
  // controleren dat het klopt in plaats van alleen de eindsom te moeten
  // vertrouwen. Toont exact dezelfde onderdelen die in het nettobedrag zitten.
  function renderBreakdownTable(settlement, checkins) {
    var ids = {};
    checkins.forEach(function (pid) { ids[pid] = true; });
    Object.keys(settlement.net || {}).forEach(function (pid) { ids[pid] = true; });
    var list = Object.keys(ids).map(function (pid) { return { id: pid, name: memberName(pid) }; });
    list.sort(function (a, b) { return a.name.localeCompare(b.name); });
    if (list.length === 0) return "";
    var html = '<div class="section-head">Volledige berekening</div>';
    html += '<div class="info-note">Alle onderdelen los, zodat je zelf kunt natellen: wat je haalde (bier + statiegeld), wat je zelf dronk, welk statiegeld op jouw bekers is terugontvangen, jouw aandeel in kwijtgeraakte bekers en de gok-bonus/malus. Netto in <span style="color:var(--good);font-weight:700">groen</span> = jij krijgt geld, in <span style="color:var(--red);font-weight:700">rood</span> = jij moet nog betalen (zie "Afrekenen" hieronder voor wie aan wie).</div>';
    html += '<div class="scroll-hint">' + icon("chevronRight", 11) + " sleep opzij voor alle kolommen</div>";
    html += '<div class="stand-table" style="margin-bottom:12px"><div class="stand-head-row" style="min-width:600px">';
    html += '<span class="stand-name" style="font-weight:700">Naam</span><span class="stand-col">Gehaald</span><span class="stand-col">Gedronken</span><span class="stand-col">Statiegeld</span><span class="stand-col">Kwijt</span><span class="stand-col">Gok</span><span class="stand-col">Netto</span>';
    html += "</div>";
    list.forEach(function (row) {
      var bk = settlement.breakdown && settlement.breakdown[row.id];
      bk = bk || { haaldeBeker: 0, haaldeCredit: 0, dronkBeker: 0, dronkDebit: 0, statiegeldTerugCups: 0, statiegeldTerugDebit: 0, kwijtAandeel: 0, gokAdjust: 0 };
      var netAmt = (settlement.net && settlement.net[row.id]) || 0;
      html += '<div class="stand-row" style="min-width:600px">';
      html += '<span class="stand-name">' + esc(row.name) + "</span>";
      html += '<span class="stand-col">' + (bk.haaldeBeker > 0 ? euro(bk.haaldeCredit) + ' <span style="color:var(--muted)">(' + bk.haaldeBeker + ")</span>" : "–") + "</span>";
      html += '<span class="stand-col">' + (bk.dronkBeker > 0 ? euroSigned(bk.dronkDebit) + ' <span style="color:var(--muted)">(' + bk.dronkBeker + ")</span>" : "–") + "</span>";
      html += '<span class="stand-col">' + (bk.statiegeldTerugCups > 0 ? euroSigned(bk.statiegeldTerugDebit) + ' <span style="color:var(--muted)">(' + bk.statiegeldTerugCups + ")</span>" : "–") + "</span>";
      html += '<span class="stand-col">' + (Math.abs(bk.kwijtAandeel) > 0.005 ? euroSigned(bk.kwijtAandeel) : "–") + "</span>";
      html += '<span class="stand-col">' + (Math.abs(bk.gokAdjust) > 0.005 ? euroSigned(bk.gokAdjust) : "–") + "</span>";
      html += '<span class="stand-col" style="font-weight:700;color:' + (netAmt >= 0 ? "var(--good)" : "var(--red)") + '">' + euroSigned(netAmt) + "</span>";
      html += "</div>";
    });
    html += "</div>";
    return html;
  }

  /* ---- Tabblad: Financiële afrekening ---- */
  function renderAfrekeningTab(match) {
    var md = matchData(match.id);
    var checkins = md.checkins || [];
    var rounds = md.rounds || [];
    var returns = md.returns || {};
    var predictions = md.predictions || {};
    var hasSettlement = rounds.length > 0 || (!!match.finalScore && Object.keys(predictions).length > 0);
    var settlement = hasSettlement
      ? computeNetBalances(checkins, rounds, returns, state.settings, predictions, match.finalScore, match.finalScoreAt)
      : { net: {}, breakdown: {}, totalBought: 0, totalReturned: 0, lostCups: 0, winnerIds: [], loserIds: [] };
    var transactions = hasSettlement ? settleNet(settlement.net) : [];

    var html = renderMatchHeader(match);
    html += '<div class="section-head" style="margin-top:0">Financiële afrekening</div>';

    if (!hasSettlement) {
      html += '<div class="empty-state"><p class="empty-body">Nog niets om af te rekenen — zodra er een beurt is geweest verschijnt hier het overzicht.</p></div>';
      return html;
    }

    html += '<div class="card"><div class="info-note" style="margin-bottom:8px">' + icon("info", 12) + settlement.totalBought + " bekers gekocht (à " + euro(state.settings.depositPerCup != null ? state.settings.depositPerCup : 1) + " statiegeld). Bekers worden ingeleverd door de haler van dat moment (zie tabblad Beurten) — wat niet is ingeleverd, wordt automatisch als kwijt geteld en eerlijk over alle aanwezigen verdeeld.</div>";
    html += '<div class="stat-row"><div class="stat-box"><div class="stat-num">' + settlement.totalBought + '</div><div class="stat-label">gekocht</div></div>';
    html += '<div class="stat-box"><div class="stat-num">' + settlement.totalReturned + '</div><div class="stat-label">ingeleverd</div></div>';
    html += '<div class="stat-box' + (settlement.lostCups > 0 ? " warn" : "") + '"><div class="stat-num">' + settlement.lostCups + '</div><div class="stat-label">kwijt</div></div></div></div>';

    html += renderBreakdownTable(settlement, checkins);

    // Checkpoint voor de beheerder: een duidelijk vinkje dat iedereen heeft
    // betaald/ontvangen, zodat de groep weet dat deze wedstrijd financieel
    // "klaar" is voordat er met een volgende wedstrijd wordt begonnen. Het
    // overzicht hierboven en hieronder blijft gewoon staan (ook via de
    // wedstrijd-kiezer bovenaan altijd terug te vinden) — dit verandert niets
    // aan de cijfers, het is puur een afvinkmoment.
    if (match.settled) {
      html += '<div class="card" style="border-color:var(--good);background:#f0fbf4;display:flex;align-items:center;justify-content:space-between;gap:10px">';
      html += '<div style="display:flex;align-items:center;gap:8px;color:var(--good);font-weight:700;font-size:13.5px">' + icon("check", 16, ' stroke-width="3"') + "Afrekening bevestigd</div>";
      if (isAdmin()) html += '<button class="btn-ghost-sm" onclick="app.setMatchSettled(\'' + match.id + "', false)\">Heropenen</button>";
      html += "</div>";
    } else if (isAdmin()) {
      html += '<div class="card"><div class="info-note" style="margin-bottom:8px">Heeft iedereen betaald/ontvangen? Bevestig de afrekening dan hieronder — dat geeft de groep een duidelijk afvinkmoment voordat jullie met de volgende wedstrijd starten.</div>';
      html += '<button class="btn-primary" onclick="app.setMatchSettled(\'' + match.id + '\', true)">' + icon("check", 15) + " Afrekening bevestigen</button></div>";
    }

    html += '<div class="section-head">Afrekenen</div>';
    html += '<div class="info-note">Alles staat hierin al verrekend: wie welke beurten meedronk, wie statiegeld voorschoot, wie het terugkreeg en het eerlijke aandeel van kwijtgeraakte bekers. Onderlinge schulden zijn tegen elkaar weggestreept.</div>';
    if (match.finalScore && (settlement.winnerIds.length > 0 || settlement.loserIds.length > 0)) {
      html += '<div class="info-note" style="margin-top:-6px">';
      var forgiven = settlement.forgivenTotal || 0;
      if (settlement.winnerIds.length > 0 && settlement.loserIds.length > 0 && forgiven > 0.005) {
        html += "🎯 " + esc(settlement.winnerIds.map(memberName).join(", ")) + " had" + (settlement.winnerIds.length === 1 ? "" : "en") + " de score goed en dronk/dronken gratis (" + euro(forgiven) + ") — dat bedrag is gelijk verdeeld over " + esc(settlement.loserIds.map(memberName).join(", ")) + ".";
      } else if (settlement.winnerIds.length > 0 && settlement.loserIds.length > 0) {
        // Winnaar(s) bekend, maar er viel niets kwijt te schelden: ofwel dronk de
        // winnaar zelf niets tijdens de wedstrijd (vóór de eindstand werd
        // ingevuld), ofwel haalde die zelf meer dan hij/zij dronk. Dit expliciet
        // benoemen voorkomt de indruk dat de gok-verrekening niet werkt.
        html += "🎯 " + esc(settlement.winnerIds.map(memberName).join(", ")) + " had de score goed, maar dronk zelf niets (netto) tijdens de wedstrijd — dus was er niets kwijt te schelden. Let op: alleen beurten van vóór het invullen van de eindstand tellen mee voor de gok-verrekening.";
      } else if (settlement.winnerIds.length > 0) {
        html += "🎯 " + esc(settlement.winnerIds.map(memberName).join(", ")) + " had de score goed, maar er waren geen verliezers om het aandeel over te verdelen.";
      } else {
        html += "Niemand had de exacte eindstand goed voorspeld — de gewone verrekening geldt.";
      }
      html += "</div>";
    }
    html += '<div class="settle-list">';
    if (transactions.length === 0) html += '<div class="empty-body">Niemand hoeft nog iets te verrekenen.</div>';
    transactions.forEach(function (t) {
      var text = "Hoi " + memberName(t.from) + "! Voor AZ - " + match.opponent + " kun je " + euro(t.amount) + " tikkien naar " + memberName(t.to) + "? 🍻";
      html += '<div class="settle-row"><div><div class="settle-name">' + esc(memberName(t.from)) + '</div><div class="settle-meta">aan ' + esc(memberName(t.to)) + "</div></div>";
      html += '<div class="settle-amount">' + euro(t.amount) + "</div>";
      html += '<button class="icon-btn" onclick="app.shareLink(' + JSON.stringify(text).replace(/"/g, "&quot;") + ')" aria-label="Deel via WhatsApp">' + icon("message", 15) + "</button></div>";
    });
    html += "</div>";
    return html;
  }

  function renderStandTab() {
    var rows = approvedMembers().map(function (m) {
      var attended = 0, hauls = 0, beers = 0;
      Object.keys(state.matchData).forEach(function (mid) {
        var d = state.matchData[mid];
        if ((d.checkins || []).indexOf(m.id) !== -1) attended++;
        (d.rounds || []).forEach(function (r) {
          roundHalers(r).forEach(function (h) { if (h.personId === m.id) { hauls++; beers += h.broughtBack || 0; } });
        });
      });
      var ratio = attended > 0 ? hauls / attended : 0;
      return { id: m.id, name: m.name, attended: attended, hauls: hauls, beers: beers, ratio: ratio };
    });
    rows.sort(function (a, b) { return b.ratio - a.ratio; });
    var html = '<div><div class="section-head" style="margin-top:0">Seizoensstand</div>';
    html += '<div class="info-note">Hoe hoger de ratio, hoe vaker iemand relatief al heeft gehaald — die staat dus achteraan bij de volgende trekking.</div>';
    html += '<div class="stand-table"><div class="stand-head-row"><span class="stand-name" style="font-weight:700">Naam</span><span class="stand-col">Aanwezig</span><span class="stand-col">Beurten</span><span class="stand-col">Bier</span></div>';
    rows.forEach(function (r, i) {
      html += '<div class="stand-row"><span class="stand-name"><span class="rank-badge">' + (i + 1) + '.</span>' + esc(r.name) + '</span><span class="stand-col">' + r.attended + '</span><span class="stand-col">' + r.hauls + '</span><span class="stand-col">' + r.beers + "</span></div>";
    });
    if (rows.length === 0) html += '<div class="empty-body" style="padding:14px">Nog geen leden toegevoegd.</div>';
    html += "</div></div>";
    return html;
  }

  function renderAdminGate() {
    var hasPasscode = !!state.adminPasscode;
    if (isAdmin() && hasPasscode) {
      return '<div class="card"><div class="info-note" style="margin-bottom:8px">Je bent ontgrendeld als beheerder op dit toestel. Alleen jij kunt wedstrijden, prijzen en leden aanpassen.</div><button class="btn-ghost-sm" onclick="app.lockAdmin()">Vergrendel beheerder</button></div>';
    }
    if (isAdmin() && !hasPasscode) {
      var html = '<div class="card"><div class="info-note">Er is nog geen beheerder ingesteld. Kies een code — wie deze als eerste instelt, is voortaan de enige die wedstrijden en prijzen mag beheren.</div>';
      html += '<div class="form-row"><input class="input" placeholder="Kies een beheerderscode" value="' + esc(ui.drafts.adminCodeInput) + '" oninput="app.setDraft(\'adminCodeInput\', this.value)" onkeydown="if(event.key===\'Enter\') app.claimAdmin()" />';
      html += '<button class="btn-primary-sm" onclick="app.claimAdmin()">Word beheerder</button></div>';
      if (ui.adminError) html += '<div class="info-note" style="color:var(--red);margin-top:4px;margin-bottom:0">' + esc(ui.adminError) + "</div>";
      html += "</div>";
      return html;
    }
    var html2 = '<div class="card"><div class="info-note">Wedstrijden, prijzen en leden worden beheerd door de beheerder van de groep. Vul de code in om dit op dit toestel te ontgrendelen.</div>';
    html2 += '<div class="form-row"><input class="input" type="password" placeholder="Beheerderscode" value="' + esc(ui.drafts.adminCodeInput) + '" oninput="app.setDraft(\'adminCodeInput\', this.value)" onkeydown="if(event.key===\'Enter\') app.unlockAdmin()" />';
    html2 += '<button class="btn-primary-sm" onclick="app.unlockAdmin()">Ontgrendel</button></div>';
    if (ui.adminError) html2 += '<div class="info-note" style="color:var(--red);margin-top:4px;margin-bottom:0">' + esc(ui.adminError) + "</div>";
    html2 += "</div>";
    return html2;
  }

  function renderInstellingenTab() {
    var admin = isAdmin();
    var html = '<div><div class="section-head" style="margin-top:0">Beheerder</div>' + renderAdminGate();
    // Voor niet-beheerders stopt dit tabblad hier: alleen het ontgrendelformulier
    // hierboven is zichtbaar (nodig om ooit weer toegang te krijgen), verder niets.
    if (!admin) { html += "</div>"; return html; }
    // Vanaf hier is `admin` altijd true (niet-beheerders zijn hierboven al teruggestuurd),
    // dus geen aparte niet-beheerder-varianten meer nodig.
    var pending = pendingMembers();
    if (pending.length > 0) {
      html += '<div class="section-head">Aanmeldingsverzoeken</div><div class="card">';
      html += '<div class="info-note">Deze mensen hebben via de link toegang aangevraagd. Keur ze goed zodra je weet dat ze erbij horen.</div>';
      html += '<div class="roster-list">';
      pending.forEach(function (m) {
        html += '<div class="roster-row"><span class="roster-name">' + esc(m.name) + '</span>';
        html += '<button class="btn-ghost-sm" style="color:var(--good);border-color:var(--good)" onclick="app.approveMember(\'' + m.id + '\')">' + icon("check", 13) + " Goedkeuren</button>";
        html += '<button class="btn-ghost-sm" onclick="app.rejectMember(\'' + m.id + '\')">' + icon("x", 13) + " Weigeren</button>";
        html += "</div>";
      });
      html += "</div></div>";
    }

    html += '<div class="section-head">Testmodus</div><div class="card">';
    html += '<div class="info-note">Bekijk en bedien de app alsof je een ander lid bent — handig om zonder je vrienden te testen hoe hun scherm eruitziet. Beheerder-only onderdelen (zoals deze instellingen en de eindstand) worden dan ook verborgen, precies zoals bij dat lid. Acties die je doet gebeuren dan echt namens die persoon.</div>';
    if (ui.viewAsId) {
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px"><span style="font-size:13.5px;font-weight:600">Je test nu als: ' + esc(memberName(ui.viewAsId)) + '</span><button class="btn-ghost-sm" onclick="app.setViewAs(null)">Terug naar mezelf</button></div>';
    } else {
      var others = approvedMembers().filter(function (m) { return m.id !== ui.me.id; });
      html += '<div class="member-chip-list">';
      others.forEach(function (m) { html += '<button class="test-pick-chip" onclick="app.setViewAs(\'' + m.id + '\')">' + esc(m.name) + "</button>"; });
      if (others.length === 0) html += '<div class="empty-body">Voeg eerst nog wat leden toe om als hen te kunnen testen.</div>';
      html += "</div>";
    }
    html += "</div>";

    html += '<div class="section-head">Wedstrijden toevoegen</div><div class="card">';
    var nm = ui.drafts.newMatch;
    html += '<div class="form-row">';
    html += '<input type="date" class="input" value="' + esc(nm.date) + '" oninput="app.setDraft(\'newMatch.date\', this.value)" />';
    html += '<input type="time" class="input" style="max-width:110px" value="' + esc(nm.time) + '" oninput="app.setDraft(\'newMatch.time\', this.value)" />';
    html += '<input class="input" placeholder="Tegenstander" value="' + esc(nm.opponent) + '" oninput="app.setDraft(\'newMatch.opponent\', this.value)" />';
    html += "</div>";
    html += '<div class="form-row"><select class="input" onchange="app.setNewMatchCompetition(this.value)">';
    ["Eredivisie", "KNVB Beker", "Europa League", "Conference League", "Vriendschappelijk", "Overig"].forEach(function (c) {
      html += '<option ' + (nm.competition === c ? "selected" : "") + ">" + c + "</option>";
    });
    html += '</select><div class="toggle-group">';
    html += '<button class="toggle-btn' + (nm.isHome ? " active" : "") + '" onclick="app.setNewMatchHome(true)">Thuis</button>';
    html += '<button class="toggle-btn' + (!nm.isHome ? " active" : "") + '" onclick="app.setNewMatchHome(false)">Uit</button>';
    html += "</div></div>";
    html += '<button class="btn-primary-sm" onclick="app.addMatch()">Toevoegen</button>';
    html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><div class="info-note">Of importeer in één klik alle 17 Eredivisie-thuiswedstrijden van seizoen 2026/27. Beker- en Europese wedstrijden worden pas later geloot.</div>';
    html += '<button class="btn-ghost-sm" onclick="app.importAzFixtures()">' + icon("download", 14) + " Importeer AZ thuisprogramma 2026/27</button>";
    if (ui.importMsg) html += '<div class="info-note" style="margin-top:8px;margin-bottom:0">' + esc(ui.importMsg) + "</div>";
    html += "</div></div>";

    html += '<div class="section-head">Leden</div><div class="card">';
    html += '<div class="info-note" style="margin-bottom:8px">Deel de link naar deze pagina zodat mensen zelf toegang kunnen aanvragen — die verschijnen dan hierboven bij "Aanmeldingsverzoeken". Handmatig toevoegen kan ook, en is meteen goedgekeurd.</div>';
    html += '<div class="form-row"><input class="input" placeholder="Naam toevoegen" value="' + esc(ui.drafts.newMemberName) + '" oninput="app.setDraft(\'newMemberName\', this.value)" onkeydown="if(event.key===\'Enter\') app.addMember()" />';
    html += '<button class="btn-primary-sm" onclick="app.addMember()">' + icon("plus", 14) + "</button></div>";
    html += '<div class="member-chip-list">';
    approvedMembers().forEach(function (m) {
      html += '<div class="member-chip">' + esc(m.name) + '<button class="chip-remove" onclick="app.removeMember(\'' + m.id + '\')" aria-label="Verwijder ' + esc(m.name) + '">' + icon("x", 12) + "</button></div>";
    });
    if (approvedMembers().length === 0) html += '<div class="empty-body">Nog geen leden.</div>';
    html += "</div></div>";

    html += '<div class="section-head">Prijzen</div><div class="card">';
    html += '<label class="field-label">Prijs per bier (excl. statiegeld)</label>';
    html += '<input type="number" step="0.10" class="input" value="' + state.settings.pricePerBeer + '" onchange="app.updateSetting(\'pricePerBeer\', parseFloat(this.value)||0)" />';
    html += '<label class="field-label" style="margin-top:12px">Statiegeld per beker</label>';
    html += '<input type="number" step="0.10" class="input" value="' + state.settings.depositPerCup + '" onchange="app.updateSetting(\'depositPerCup\', parseFloat(this.value)||0)" />';
    html += '<label class="field-label" style="margin-top:12px">Max. bier dat 1 persoon kan tillen/halen</label>';
    html += '<input type="number" class="input" value="' + state.settings.cupsPerRun + '" onchange="app.updateSetting(\'cupsPerRun\', parseInt(this.value,10)||1)" />';
    html += '<div class="info-note" style="margin-top:6px;margin-bottom:0">Is er in totaal meer nodig dan dit aantal, dan wijst de app zelf meerdere halers aan die het samen verdelen.</div></div>';

    html += '<div class="section-head">Wedstrijden beheren</div><div class="card">';
    var sorted = state.matches.slice().sort(function (a, b) { return a.date > b.date ? 1 : -1; });
    if (sorted.length === 0) html += '<div class="empty-body">Nog geen wedstrijden.</div>';
    sorted.forEach(function (m) {
      html += '<div class="manage-match-block"><div class="manage-match-row"><span>' + esc(m.date) + " · AZ – " + esc(m.opponent) + "</span>";
      html += '<button class="icon-btn" onclick="app.removeMatch(\'' + m.id + '\')" aria-label="Verwijder wedstrijd">' + icon("trash", 14) + "</button></div>";
      html += '<div class="manage-match-detail-row"><label class="manage-match-label">Aftrap' + (m.time ? "" : ' <span style="color:var(--red);font-weight:700">nog invullen</span>') + '<input type="time" class="input-tiny" value="' + esc(m.time || "") + '" onchange="app.updateMatchTime(\'' + m.id + '\', this.value)" /></label>';
      html += '<label class="manage-match-label">Duur (min)<input type="number" min="30" step="5" class="input-tiny" style="width:60px" value="' + (m.estimatedDurationMin || 120) + '" onchange="app.updateMatchDuration(\'' + m.id + '\', parseInt(this.value,10)||120)" /></label>';
      html += '<label class="manage-match-label">Eindstand<input type="number" min="0" class="input-score" placeholder="–" value="' + (m.finalScore ? m.finalScore.home : "") + '" onchange="app.setMatchFinalScore(\'' + m.id + "', this.value===''?null:(parseInt(this.value,10)||0), " + (m.finalScore ? m.finalScore.away : 0) + ')" />';
      html += '<span style="margin:0 2px">–</span><input type="number" min="0" class="input-score" placeholder="–" value="' + (m.finalScore ? m.finalScore.away : "") + '" onchange="app.setMatchFinalScore(\'' + m.id + "', " + (m.finalScore ? m.finalScore.home : 0) + ", this.value===''?null:(parseInt(this.value,10)||0))\" />";
      if (m.finalScore) html += '<button class="chip-remove" onclick="app.setMatchFinalScore(\'' + m.id + '\', null, null)" aria-label="Eindstand wissen">' + icon("x", 12) + "</button>";
      html += "</label></div></div>";
    });
    html += '<div class="info-note" style="margin-top:8px;margin-bottom:0">"Duur" is de geschatte speeltijd inclusief rust en blessuretijd — daarmee laat de app 5 minuten voor het (verwachte) einde zien wie de lege bekers moet innemen.</div>';
    html += "</div></div>";
    return html;
  }

  /* ================= top-level render ================= */
  // Realtime-updates kunnen in een kort tijdsbestek met veel tegelijk binnen-
  // komen (bijv. iedereen die rond hetzelfde moment "ik wil bier" tikt). Elk
  // los binnenkomend berichtje meteen het hele scherm laten hertekenen voelt
  // dan hortend aan en kan zelfs je eigen tik onderbreken — dus bundelen we
  // een stortvloed aan updates tot één hertekening (120ms). Staat iemand op
  // dat moment middenin een tekstveld te typen (bv. een gok-score), dan
  // wachten we nóg even langer, zodat een binnenkomende update van iemand
  // anders dat typen niet onderbreekt.
  var renderDebounceTimer = null;
  function scheduleRender() {
    if (renderDebounceTimer) return;
    renderDebounceTimer = setTimeout(flushRender, 120);
  }
  function flushRender() {
    renderDebounceTimer = null;
    var active = document.activeElement;
    var isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA") && active.type !== "button";
    if (isTyping) { renderDebounceTimer = setTimeout(flushRender, 400); return; }
    render();
  }

  function render() {
    var root = document.getElementById("app");
    if (loadError) { root.innerHTML = renderLoadError(); return; }
    if (!supabaseReady) { root.innerHTML = renderLoading(); return; }
    if (ui.me) {
      var myRec = state.members.find(function (m) { return m.id === ui.me.id; });
      if (!myRec) {
        // Verzoek is geweigerd (of het lid is verwijderd): terug naar onboarding.
        ui.me = null; setLocal("me", null);
      } else if (myRec.status === "pending") {
        root.innerHTML = renderPendingGate(myRec);
        return;
      }
    }
    if (!ui.me) { root.innerHTML = renderOnboarding(); return; }

    // Niet-beheerders horen tabbladen als "Stand" niet te zien — val terug als
    // de opgeslagen navigatie (of een testmodus-wissel) daar per ongeluk op staat.
    // "instellingen" valt hier bewust buiten (zie ADMIN_ONLY_TABS hierboven).
    if (!isAdmin() && ADMIN_ONLY_TABS.indexOf(ui.activeTab) !== -1) ui.activeTab = "aanmelden";

    if (PARTICIPANT_TABS.indexOf(ui.activeTab) !== -1 && !ui.explicitlyBrowsing && state.matches.length > 0 && !ui.selectedMatchId) {
      var nextId = getNextMatchId(state.matches);
      if (nextId) ui.selectedMatchId = nextId;
    }

    var html = '<div class="shell">' + renderHeader() + '<main class="main">';
    if (PARTICIPANT_TABS.indexOf(ui.activeTab) !== -1) {
      var selected = ui.selectedMatchId ? state.matches.find(function (m) { return m.id === ui.selectedMatchId; }) : null;
      if (!selected) {
        html += renderNoMatch();
      } else if (ui.activeTab === "aanmelden") {
        html += renderAanmeldenTab(selected);
      } else if (ui.activeTab === "beurten") {
        html += renderBeurtenTab(selected);
      } else if (ui.activeTab === "afrekening") {
        html += renderAfrekeningTab(selected);
      }
    } else if (ui.activeTab === "stand") {
      html += renderStandTab();
    } else if (ui.activeTab === "instellingen") {
      html += renderInstellingenTab();
    }
    html += "</main></div>";
    root.innerHTML = html;
  }

  function renderLoading() {
    return '<div class="shell"><div class="loading-wrap">' + icon("loader", 20) + " Verbinden met de database…</div></div>";
  }

  function renderLoadError() {
    var html = '<div class="shell"><div class="onboard">';
    html += alkmaarWapen(52);
    html += '<h1 class="onboard-title" style="font-size:22px">Kan niet verbinden</h1>';
    html += '<p class="onboard-sub">' + esc(loadError) + "</p>";
    html += '<button class="btn-primary" onclick="location.reload()">Opnieuw proberen</button>';
    html += "</div></div>";
    return html;
  }

  /* ================= boot ================= */
  (async function boot() {
    render(); // toont het laadscherm (supabaseReady is nog false)
    await initSupabase();
    setInterval(render, 30000); // ververst tijdgevoelige UI (bv. voorspellen-op-slot, reveal-tijd) zonder te publiceren
  })();
})();
</script>
</body>
</html>
